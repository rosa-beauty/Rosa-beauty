<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>روزا بيوتى – بطاقة أعمال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#070E22; --bg2:#0D1A3D; --surface:#101F47; --gold:#C9A24B; --gold-l:#EBD491;
  --text:#F4EFE2; --muted:#9FAACB; --line:rgba(201,162,75,.28);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font-family:"Tajawal",system-ui,sans-serif;
  background-image:radial-gradient(120% 60% at 50% 0%,var(--bg2) 0%,var(--bg) 70%);
  display:flex;justify-content:center;padding:28px 18px 40px;
}
.card{width:100%;max-width:430px;text-align:center}
.avatar{
  width:min(100%,340px);margin:4px auto 22px;border-radius:30px;padding:4px;
  background:conic-gradient(from 200deg,var(--gold),var(--gold-l),var(--gold),#8a6b25,var(--gold));
  box-shadow:0 0 0 6px rgba(201,162,75,.12),0 0 38px rgba(201,162,75,.35);
}
.avatar img{width:100%;height:auto;border-radius:26px;background:#fff;padding:6px;display:block;border:3px solid var(--bg)}
h1{font-family:"Amiri",serif;font-size:2.1rem;line-height:1.3;color:var(--gold-l);font-weight:700}
.title:empty{display:none}
.title{margin-top:6px;font-size:1.02rem;font-weight:500;color:var(--text)}
.bio{margin:14px auto 0;max-width:34ch;font-size:.95rem;line-height:1.9;color:var(--muted)}
.rule{height:1px;margin:26px 8px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:10px 12px;
  border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);
  font:inherit;font-weight:500;font-size:.98rem;text-decoration:none;cursor:pointer;
  transition:transform .15s,border-color .15s,background .15s;
}
.btn:hover{border-color:var(--gold);background:#152758}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.btn svg{width:20px;height:20px;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wide{grid-column:1/-1}
.save{
  min-height:62px;font-size:1.1rem;font-weight:700;color:#1b1405;border:0;
  background:linear-gradient(135deg,var(--gold-l),var(--gold) 55%,#a98332);
  box-shadow:0 8px 26px rgba(201,162,75,.3);
}
.save:hover{background:linear-gradient(135deg,#f3dfa4,var(--gold-l) 55%,var(--gold))}
.save svg{stroke:#1b1405}
.social{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
.social a{
  padding:9px 18px;border-radius:999px;border:1px solid var(--line);color:var(--gold-l);
  text-decoration:none;font-size:.9rem;transition:background .15s,border-color .15s;
}
.social a:hover{border-color:var(--gold);background:rgba(201,162,75,.1)}
.social a:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.modal{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;
  background:rgba(4,8,20,.82);backdrop-filter:blur(6px);z-index:20;
}
.modal.open{display:flex}
.sheet{
  width:100%;max-width:340px;background:var(--surface);border:1px solid var(--gold);border-radius:22px;
  padding:26px 22px 22px;animation:pop .22s ease-out;
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.sheet h2{font-family:"Amiri",serif;color:var(--gold-l);font-size:1.4rem;margin-bottom:4px}
.sheet p{color:var(--muted);font-size:.88rem;margin-bottom:18px}
#qr{width:208px;height:208px;margin:0 auto 18px;padding:10px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center}
#qr img,#qr canvas{max-width:100%;height:auto}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--gold);color:#1b1405;padding:11px 20px;border-radius:999px;font-weight:700;font-size:.92rem;
  opacity:0;pointer-events:none;transition:.25s;z-index:30;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="avatar"><img id="photo" alt="الصورة الشخصية"></div>
  <h1 id="name"></h1>
  <p class="title" id="job"></p>
  <p class="bio" id="bio"></p>
  <div class="rule"></div>

  <div class="actions">
    <button class="btn save wide" id="saveBtn" type="button">
      <svg viewBox="0 0 24 24"><path d="M15 19c0-2.2-2.7-4-6-4s-6 1.8-6 4M9 11a4 4 0 100-8 4 4 0 000 8zM19 8v6M16 11h6"/></svg>
      احفظ رقمي في هاتفك
    </button>
    <a class="btn" id="callBtn" href="#">
      <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>
      اتصال مباشر
    </a>
    <a class="btn" id="waBtn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M4 20l1.3-4A8 8 0 114 20zM9 9c0 3 3 6 6 6l1.2-1.6-2-1-1 .6a4 4 0 01-1.8-1.8l.6-1-1-2z"/></svg>
      واتساب
    </a>
    <a class="btn" id="mapBtn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11zM12 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z"/></svg>
      موقع الصالون
    </a>
    <button class="btn" id="qrBtn" type="button">
      <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>
      كود QR
    </button>
  </div>

  <nav class="social" id="social" aria-label="السوشيال ميديا"></nav>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
  <div class="sheet">
    <h2 id="qrTitle">امسح الكود</h2>
    <p>وجّه كاميرا الموبايل ناحية الكود لفتح الكارت</p>
    <div id="qr"></div>
    <button class="btn wide" id="closeBtn" type="button" style="width:100%">إغلاق</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

/* ================================= */

const $ = id => document.getElementById(id);
const initials = DATA.name.replace(/^د\.\s*/,"").trim().charAt(0);
const fallback = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#13234f"/><text x="60" y="78" font-size="56" text-anchor="middle" fill="#EBD491" font-family="serif">'+initials+'</text></svg>');

$("name").textContent = DATA.name;
$("job").textContent = DATA.title;
$("bio").innerHTML = DATA.bio.split("\n").map(s=>s.replace(/</g,"&lt;")).join("<br>");
$("photo").src = DATA.photo || fallback;
$("callBtn").href = "tel:" + DATA.phone;
$("waBtn").href = "https://wa.me/" + DATA.whatsapp;
$("mapBtn").href = DATA.maps;
DATA.social.forEach(s=>{
  const a = document.createElement("a");
  a.href = s.url; a.textContent = s.label; a.target = "_blank"; a.rel = "noopener";
  $("social").appendChild(a);
});

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2400);
}

$("callBtn").addEventListener("click", e=>{
  e.preventDefault();
  try{ window.location.href = "tel:" + DATA.phone; }catch(_){}
  setTimeout(()=>{ if(!document.hidden) toast("الرقم: " + DATA.phone.replace("+20","0")); }, 900);
});

/* vCard */
$("saveBtn").addEventListener("click", ()=>{
  const vcf = [
    "BEGIN:VCARD","VERSION:3.0",
    "FN:"+DATA.name, "N:;"+DATA.name+";;;",
    "TITLE:"+DATA.title,
    "TEL;TYPE=CELL:"+DATA.phone,
    "EMAIL:"+DATA.email,
    "URL:"+DATA.maps,
    "END:VCARD"
  ].join("\r\n");
  try{
    const blob = new Blob([vcf], {type:"text/vcard;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "contact.vcf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    toast("تم تحميل ملف جهة الاتصال");
  }catch(e){
    toast("تعذّر تحميل الملف من هذه الصفحة");
  }
});

/* QR */
let qrDone = false;
function openQR(){
  $("modal").classList.add("open");
  if(!qrDone){
    try{
      new QRCode($("qr"), {text: location.href, width:188, height:188, colorDark:"#0A1530", colorLight:"#ffffff"});
      qrDone = true;
    }catch(e){ $("qr").textContent = "تعذّر إنشاء الكود"; }
  }
  $("closeBtn").focus();
}
function closeQR(){ $("modal").classList.remove("open"); }
$("qrBtn").addEventListener("click", openQR);
$("closeBtn").addEventListener("click", closeQR);
$("modal").addEventListener("click", e=>{ if(e.target===$("modal")) closeQR(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeQR(); });
</script>
